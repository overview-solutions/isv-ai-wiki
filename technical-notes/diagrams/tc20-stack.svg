<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ThunderCloud 2.0 stack, control down, readings up">
  <style>
    text { font-family: "DM Sans", system-ui, sans-serif; }
    .cloud-only { display: none; }
