    <text x="148" y="28" font-size="10" fill="#666">enable / disable / config / balance</text>
    <path d="M400 13 L409 27 L391 27 Z" fill="#175CD3"/>
    <text x="418" y="28" font-size="11" fill="#175CD3" font-weight="600">Readings up</text>
    <text x="510" y="28" font-size="10" fill="#666">kWh / power / voltage / state / SSE</text>
  </g>
<text class="cloud-only" x="20" y="62" fill="#9a9990" font-size="11">L6 - CLOUD HEADEND</text>
