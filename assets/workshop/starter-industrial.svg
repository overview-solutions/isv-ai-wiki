<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
  <title id="t">Three-phase bus bars, DIN-rail controller, and circuit monitor</title>
  <rect width="320" height="200" fill="#EEEDFE"/>
  <!-- cabinet frame -->
  <rect x="24" y="24" width="272" height="152" rx="6" fill="#f7f6f3" stroke="#534AB7" stroke-width="1.5"/>
  <!-- 3-phase bus -->
  <rect x="40" y="40" width="200" height="8" rx="1" fill="#BA7517"/>
  <rect x="40" y="56" width="200" height="8" rx="1" fill="#3B6D11"/>
  <rect x="40" y="72" width="200" height="8" rx="1" fill="#0F6E56"/>
  <!-- CT rings on each phase -->
  <circle cx="88" cy="44" r="7" fill="none" stroke="#1c1c1a" stroke-width="1.6"/>
  <circle cx="88" cy="60" r="7" fill="none" stroke="#1c1c1a" stroke-width="1.6"/>
  <circle cx="88" cy="76" r="7" fill="none" stroke="#1c1c1a" stroke-width="1.6"/>
  <path d="M88 51v2M88 67v2" stroke="#1c1c1a" stroke-width="1.2"/>
  <!-- DIN rail -->
  <rect x="40" y="108" width="240" height="10" rx="1" fill="#9a9990"/>
  <!-- controller module -->
  <rect x="52" y="96" width="72" height="56" rx="3" fill="#0F6E56"/>
  <rect x="60" y="104" width="56" height="16" rx="2" fill="#E1F5EE"/>
  <circle cx="68" cy="136" r="4" fill="#97C459"/>
  <circle cx="84" cy="136" r="4" fill="#FAEEDA"/>
  <circle cx="100" cy="136" r="4" fill="#BA7517"/>
  <!-- breaker / contactor -->
  <rect x="140" y="96" width="44" height="56" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.3"/>
  <path d="M152 108h20M152 118h20M152 128h20" stroke="#3B6D11" stroke-width="2" stroke-linecap="round"/>
  <rect x="154" y="136" width="16" height="8" rx="1" fill="#3B6D11"/>
  <!-- second module -->
  <rect x="200" y="96" width="64" height="56" rx="3" fill="#ffffff" stroke="#534AB7" stroke-width="1.3"/>
  <rect x="210" y="108" width="18" height="28" rx="1" fill="#97C459"/>
  <rect x="236" y="108" width="18" height="28" rx="1" fill="#3B6D11"/>
  <!-- drop from CTs to controller -->
  <path d="M88 83 V96" stroke="#5a5a55" stroke-width="1.3" stroke-dasharray="3 2"/>
</svg>
