<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t">
  <title id="t">Solar array and battery with a clamp-on monitor on the cable</title>
  <rect width="320" height="200" fill="#E1F5EE"/>
  <!-- solar array (tilted panels, not a claim about a specific site) -->
  <g fill="#97C459" stroke="#3B6D11" stroke-width="1.3" stroke-linejoin="round">
    <path d="M28 52 L84 36 L84 68 L28 84 Z"/>
    <path d="M96 52 L152 36 L152 68 L96 84 Z"/>
    <path d="M36 52 L76 42 M36 64 L76 54 M36 76 L76 66" fill="none" stroke-width="1"/>
    <path d="M104 52 L144 42 M104 64 L144 54 M104 76 L144 66" fill="none" stroke-width="1"/>
  </g>
  <path d="M56 84 V100" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
  <path d="M124 84 V100" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
  <!-- inverter / battery bank: generation, not a keypad meter -->
  <rect x="40" y="100" width="96" height="52" rx="4" fill="#f7f6f3" stroke="#0F6E56" stroke-width="1.5"/>
  <rect x="50" y="110" width="28" height="32" rx="2" fill="#3B6D11"/>
  <rect x="86" y="110" width="38" height="16" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <rect x="86" y="130" width="38" height="12" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <!-- feeder cable -->
  <path d="M136 126 H210" fill="none" stroke="#1c1c1a" stroke-width="4" stroke-linecap="round"/>
  <!-- CT clamp around cable -->
  <path d="M186 110 a16 16 0 1 1 0 32" fill="none" stroke="#BA7517" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M186 114 v6" stroke="#BA7517" stroke-width="2.4"/>
  <path d="M186 132 v6" stroke="#BA7517" stroke-width="2.4"/>
  <!-- monitor head (display only) -->
  <rect x="220" y="96" width="72" height="56" rx="5" fill="#1c1c1a" stroke="#0F6E56" stroke-width="1.5"/>
  <rect x="228" y="106" width="56" height="28" rx="2" fill="#E1F5EE"/>
  <polyline points="232,126 244,118 256,122 268,110 276,114" fill="none" stroke="#0F6E56" stroke-width="1.8"/>
  <rect x="232" y="140" width="14" height="5" rx="1" fill="#97C459"/>
  <rect x="250" y="140" width="14" height="5" rx="1" fill="#BA7517"/>
  <rect x="268" y="140" width="14" height="5" rx="1" fill="#3B6D11"/>
  <path d="M210 126 H220" stroke="#BA7517" stroke-width="1.6"/>
</svg>
