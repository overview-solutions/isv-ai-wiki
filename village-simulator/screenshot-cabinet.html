<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
// Auto-click Cabinet Builder button after page loads
window.addEventListener('load', () => {
  setTimeout(() => {
    const cabinetBtn = document.getElementById('view-mode-cabinet');
    if (cabinetBtn) {
      cabinetBtn.click();
      console.log('Clicked Cabinet Builder button');
      // Signal screenshot ready
      document.body.setAttribute('data-screenshot-ready', 'true');
    }
  }, 2000);
});
</script>
<meta http-equiv="refresh" content="0; url=index.html">
</head>
<body>Loading Cabinet View...</body>
</html>
