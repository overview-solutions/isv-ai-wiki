name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Write Mapbox config from secret
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
            echo "::warning::MAPBOX_PUBLIC_TOKEN not set — embedded map will show a setup message"
            echo "window.MAPBOX_TOKEN = '';" > js/map-config.js
          else
            printf 'window.MAPBOX_TOKEN = %s;\n' "$(jq -Rn --arg t "$MAPBOX_PUBLIC_TOKEN" '$t')" > js/map-config.js
          fi

      - uses: actions/configure-pages@v5

      - id: artifact-name
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
